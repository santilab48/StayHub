name: StayHub P1 build and security check (no deploy)

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Dummy public configuration for compile checks; never points to production.
      NEXT_PUBLIC_SUPABASE_URL: https://build-only.invalid
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: build-only-placeholder
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Routing and architecture structure test
        run: npm run test:structure
      - name: Railway staging migration contract check
        run: npm run test:migration
      - name: Identity and QR property isolation contract check
        run: npm run test:id-binding
      - name: Railway Local-First sync contract
        run: node scripts/test-local-sync-contract.mjs
      - name: IndexedDB v3 persistence, migration and sync tests
        run: npx tsx --test tests/local-db.test.ts tests/p2b-sync.test.ts
      - name: Encrypted P5.9 backup and restore regression
        run: npx tsx --test tests/p59-backup.test.ts
      - name: Static P1 audit
        run: npm run audit:p1
      - name: Type check
        run: npm run typecheck
      - name: Production build (no deploy)
        run: npm run build
