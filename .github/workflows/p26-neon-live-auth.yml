name: StayHub P2.6 Neon live staging auth E2E

on:
  push:
    branches: ['feat/stayhub-p26-readiness']
    paths: ['.github/workflows/p26-neon-live-auth.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  neon-live-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Authenticated real HTTP read/write against Neon-backed Railway staging
        shell: bash
        env:
          BASE: https://stayhub-fsd-staging.up.railway.app
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import {randomBytes} from 'node:crypto'
          const base=process.env.BASE
          const email='p26-neon-live-'+randomBytes(9).toString('hex')+'@example.invalid'
          const password='P26-Neon-Test-'+randomBytes(18).toString('hex')
          async function call(path,{method='GET',body,cookie}={}){
            const headers={}
            if(body){headers['content-type']='application/json';headers.origin=base}
            if(cookie)headers.cookie=cookie
            const r=await fetch(base+path,{method,headers,body:body?JSON.stringify(body):undefined,redirect:'manual'})
            return {status:r.status,body:await r.json().catch(()=>null),cookie:r.headers.get('set-cookie')?.split(';')[0]}
          }
          function eq(r,status,label){assert.equal(r.status,status,label+' unexpected HTTP '+r.status);console.log('PASS '+label+' HTTP '+status);return r}
          eq(await call('/api/health/db'),200,'Neon DB readiness')
          eq(await call('/api/v2/me'),401,'unauthenticated denied')
          const registered=eq(await call('/api/v2/register',{method:'POST',body:{email,password}}),201,'live staging signup')
          assert.match(registered.cookie||'',/^stayhub_session=/)
          const session=eq(await call('/api/v2/me',{cookie:registered.cookie}),200,'Neon-backed session')
          assert.equal(session.body.email,email)
          // P2-C: one scoped staging fixture, replay, revision conflict, isolation.
          const {randomUUID}=await import('node:crypto')
          const marker='p2c-sync-'+randomBytes(6).toString('hex')
          const property=eq(await call('/api/v2/property',{method:'POST',cookie:registered.cookie,body:{name:marker,type:'apartment'}}),201,'sync fixture property').body.id
          const membership=eq(await call('/api/v2/sync/properties',{cookie:registered.cookie}),200,'owner sync property mapping')
          assert.ok(membership.body.properties.some(p=>p.id===property))
          const outsiderEmail='p2c-outsider-'+randomBytes(8).toString('hex')+'@example.invalid'
          const outsider=eq(await call('/api/v2/register',{method:'POST',body:{email:outsiderEmail,password}}),201,'outsider staging account')
          const denied=eq(await call('/api/v2/sync/properties',{cookie:outsider.cookie}),200,'outsider property list')
          assert.ok(!denied.body.properties.some(p=>p.id===property))
          const operationId=randomUUID(), entityId=randomUUID()
          const syncBody={operationId,propertyId:property,entityId,entityType:'units',action:'upsert',baseRevision:0,payload:{name:marker+'-101'}}
          const write=eq(await call('/api/v2/sync',{method:'POST',cookie:registered.cookie,body:syncBody}),200,'staging sync accepted')
          assert.equal(write.body.result,'accepted')
          const replay=eq(await call('/api/v2/sync',{method:'POST',cookie:registered.cookie,body:syncBody}),200,'staging sync replay')
          assert.equal(replay.body.result,'duplicate')
          assert.equal(replay.body.originalResult,'accepted')
          const stale=eq(await call('/api/v2/sync',{method:'POST',cookie:registered.cookie,body:{...syncBody,operationId:randomUUID(),payload:{name:marker+'-conflict'}}}),200,'stale revision conflict')
          assert.equal(stale.body.result,'conflict')
          eq(await call('/api/v2/sync',{method:'POST',cookie:outsider.cookie,body:{...syncBody,operationId:randomUUID()}}),403,'cross-account sync denied')
          const units=eq(await call('/api/v2/units?propertyId='+property,{cookie:registered.cookie}),200,'owner sync units readback')
          assert.equal(units.body.items.filter(u=>u.id===entityId).length,1)
          assert.equal(units.body.items.find(u=>u.id===entityId).name,marker+'-101')
          console.log('P2C_STAGING_FIXTURE',JSON.stringify({propertyId:property,operationId,entityId,marker}))
          eq(await call('/api/v2/logout',{method:'POST',body:{},cookie:registered.cookie}),200,'logout')
          eq(await call('/api/v2/me',{cookie:registered.cookie}),401,'session revoked')
          console.log('PASS Neon-backed Railway Staging authenticated HTTP E2E')
          NODE
